name: smart_taxi_security
description: "SafeRide - Real-time Passenger & Driver Safety Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking & HTTP
  http: ^1.2.1
  dio: ^5.4.3+1
  
  # WebSockets for Real-time GPS & SOS Alerts
  socket_io_client: ^2.0.3+1
  
  # Persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  
  # Geolocation & Mapping
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  
  # QR Scanner & Generator
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0
  
  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  
  # Launchers & Sharing
  url_launcher: ^6.2.6
  share_plus: ^8.0.3
  
  # Audio Siren / Feedback
  audioplayers: ^6.0.0
  vibration: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
